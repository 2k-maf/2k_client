name: Deploy client

on:
  push:
    branches: [main]
    # Зміни лише в документації не мають передеплоювати збірку.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Два деплої одночасно публікували б версії в непередбачуваному порядку.
concurrency:
  group: deploy-client
  cancel-in-progress: false

# Креденшели AWS цьому воркфлову більше не потрібні: фронтенд живе на
# Cloudflare Pages. Див. ADR 0006 у 2k_api.
permissions:
  contents: read

jobs:
  deploy:
    name: Зібрати й опублікувати на Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Репозиторій тримає pnpm-lock.yaml і не має package-lock.json.
      # pnpm ставимо до setup-node, бо setup-node шукає бінарник pnpm
      # для свого кешу.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile забороняє мовчазне оновлення залежностей.
      # Це важливо: react-scripts у package.json заданий як "latest",
      # тож без лок-файлу кожна збірка брала б іншу версію.
      - name: Встановити залежності
        run: pnpm install --frozen-lockfile

      - name: Тести Pages Function
        run: node --test edge/*.test.mjs

      # GitHub Actions задає CI=true, а react-scripts у такому режимі
      # вважає попередження помилками. Це навмисно: збірка з попередженнями
      # у прод не потрапляє.
      - name: Зібрати продакшн-версію
        run: pnpm run build

      # Pages сам розводить файли: build/ — статика, functions/ — функція,
      # build/_routes.json — які шляхи йдуть у функцію. Атомарна публікація:
      # нова версія стає активною цілком, тому двопрохідна заливка й
      # інвалідація кешу, як були з S3 і CloudFront, тут не потрібні.
      #
      # --branch=main публікує в production, якщо проєкт створено з
      # --production-branch=main. Будь-яка інша гілка дала б preview.
      - name: Опублікувати
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          pnpm exec wrangler pages deploy build \
            --project-name "${{ vars.CF_PAGES_PROJECT }}" \
            --branch main \
            --commit-hash "${{ github.sha }}"

      # Перевірка не потребує жодних прав: це звичайний HTTP-запит.
      # Крок пропускається, доки SITE_URL не заданий.
      - name: Перевірити, що сайт віддає нову збірку
        if: vars.SITE_URL != ''
        run: |
          set -euo pipefail
          BUNDLE=$(node -e "process.stdout.write(require('./build/asset-manifest.json').entrypoints[0])")
          echo "Очікуваний бандл: $BUNDLE"
          # Публікація на edge розходиться за секунди, але не миттєво.
          for i in 1 2 3 4 5 6; do
            html=$(curl -sfL "${{ vars.SITE_URL }}?t=$(date +%s)$i" || true)
            if echo "$html" | grep -q "$BUNDLE"; then
              // Без ?t=: саме цей URL кешує CF. Cache-bust ховає отруєний HIT.
              ctype=$(curl -sL -o /tmp/bundle-check.bin -w '%{content_type}' \
                "${{ vars.SITE_URL }}/${BUNDLE}" || true)
              echo "Content-Type бандла: $ctype"
              if echo "$ctype" | grep -qi 'javascript\|ecmascript'; then
                # Додатково: перші байти мають бути JS, не <!doctype html>
                if head -c 40 /tmp/bundle-check.bin | grep -qi '<!doctype\|<html'; then
                  echo "Відповідь виглядає як HTML при JS Content-Type — повтор"
                else
                  echo "Сайт віддає нову збірку (index + JS OK)"
                  exit 0
                fi
              fi
              echo "index посилається на бандл, але відповідь ще не JS — повтор"
            fi
            sleep 10
          done
          echo "index.html на сайті не посилається на $BUNDLE або бандл не JS"
          exit 1

      # API через функцію: /hello не потребує ні бази, ні авторизації.
      # 200 означає, що функція, змінні Pages і Lambda разом працюють.
      #
      # Повтори потрібні з тієї самої причини, що й у кроці вище: власний
      # домен кілька секунд віддає попередній деплой. Попередній крок цього
      # не ловить, якщо збірка не змінилась (той самий хеш бандла). Так
      # 2026-10-02 перевірка влучила в деплой без змінних Pages і отримала 500.
      - name: Перевірити, що API відповідає через функцію
        if: vars.SITE_URL != ''
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            # || true: мережевий збій дає код 000 і ще одну спробу, а не вихід через set -e.
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -H 'accept: application/json' "${{ vars.SITE_URL }}/hello" || true)
            echo "Спроба $i: GET /hello → $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "/hello не відповів 200 за 60 секунд"
          exit 1
