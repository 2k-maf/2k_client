name: PR checks

on:
  pull_request:
    branches: [main]

# Новий пуш у PR скасовує попередній прогін — економія хвилин Actions.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Жодних креденшелів AWS: перевірка PR нічого не деплоїть.
permissions:
  contents: read

jobs:
  build:
    name: Типи та збірка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Репозиторій тримає pnpm-lock.yaml і не має package-lock.json.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Встановити залежності
        run: pnpm install --frozen-lockfile

      # Pages Function (edge/) не входить у tsconfig і не входить у збірку
      # Vite, тому перевіряється окремо: тести й пробне пакування wrangler.
      - name: Тести Pages Function
        run: node --test edge/*.test.mjs

      - name: Зібрати Pages Function
        env:
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler pages functions build --outdir "$RUNNER_TEMP/functions"

      - name: Тести фронтенду
        run: pnpm test

      # Скрипт build спершу запускає tsc --noEmit, тож окремий крок типів
      # не потрібен. Збірка тут проходить рівно ті ж перевірки, що й деплой.
      - name: Зібрати продакшн-версію
        run: pnpm run build
